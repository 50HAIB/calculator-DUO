<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultra-Premium Scientific & Standard Calculator</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            accent: 'var(--color-accent)',
            'accent-glow': 'var(--color-glow)',
            'glass-bg': 'var(--color-glass)',
            'glass-border': 'var(--color-border)',
            'btn-num': 'var(--color-btn-num)',
            'btn-op': 'var(--color-btn-op)',
            'btn-fn': 'var(--color-btn-fn)',
          }
        }
      }
    }
  </script>

  <style>
    /* ==========================================================================
       THEME VARIABLES & CUSTOM STYLES
       ========================================================================== */
    :root {
      /* Default Theme: Cyberpunk Neon */
      --color-accent: #06b6d4;
      --color-glow: rgba(6, 182, 212, 0.4);
      --color-glass: rgba(15, 23, 42, 0.75);
      --color-border: rgba(255, 255, 255, 0.12);
      --color-btn-num: rgba(30, 41, 59, 0.7);
      --color-btn-op: rgba(14, 116, 144, 0.3);
      --color-btn-fn: rgba(51, 65, 85, 0.6);
      --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 100%);
    }

    [data-theme="emerald"] {
      --color-accent: #10b981;
      --color-glow: rgba(16, 185, 129, 0.4);
      --color-glass: rgba(6, 78, 59, 0.25);
      --color-border: rgba(16, 185, 129, 0.2);
      --color-btn-num: rgba(15, 23, 42, 0.7);
      --color-btn-op: rgba(6, 95, 70, 0.4);
      --color-btn-fn: rgba(30, 41, 59, 0.6);
      --bg-gradient: radial-gradient(circle at 50% 20%, #022c22 0%, #020617 100%);
    }

    [data-theme="sunset"] {
      --color-accent: #f43f5e;
      --color-glow: rgba(244, 63, 94, 0.4);
      --color-glass: rgba(88, 28, 135, 0.25);
      --color-border: rgba(244, 63, 94, 0.2);
      --color-btn-num: rgba(15, 23, 42, 0.7);
      --color-btn-op: rgba(159, 18, 57, 0.4);
      --color-btn-fn: rgba(30, 41, 59, 0.6);
      --bg-gradient: radial-gradient(circle at 50% 20%, #4c0519 0%, #020617 100%);
    }

    [data-theme="midnight"] {
      --color-accent: #8b5cf6;
      --color-glow: rgba(139, 92, 246, 0.35);
      --color-glass: rgba(18, 18, 28, 0.85);
      --color-border: rgba(255, 255, 255, 0.08);
      --color-btn-num: rgba(24, 24, 38, 0.8);
      --color-btn-op: rgba(91, 33, 182, 0.3);
      --color-btn-fn: rgba(39, 39, 58, 0.8);
      --bg-gradient: radial-gradient(circle at 50% 20%, #000000 0%, #09090b 100%);
    }

    [data-theme="solar"] {
      --color-accent: #f59e0b;
      --color-glow: rgba(245, 158, 11, 0.4);
      --color-glass: rgba(69, 26, 3, 0.3);
      --color-border: rgba(245, 158, 11, 0.2);
      --color-btn-num: rgba(15, 23, 42, 0.7);
      --color-btn-op: rgba(180, 83, 9, 0.4);
      --color-btn-fn: rgba(30, 41, 59, 0.6);
      --bg-gradient: radial-gradient(circle at 50% 20%, #451a03 0%, #020617 100%);
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* Glassmorphism Card Effect */
    .glass-panel {
      background: var(--color-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--color-glow);
    }

    /* Tactile Button Styling */
    .calc-btn {
      position: relative;
      background: var(--color-btn-num);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .calc-btn:hover {
      transform: translateY(-2px);
      border-color: var(--color-accent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 6px 15px rgba(0, 0, 0, 0.4), 0 0 12px var(--color-glow);
    }

    .calc-btn:active, .calc-btn.btn-active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      border-color: var(--color-accent);
    }

    .calc-btn-op {
      background: var(--color-btn-op);
      color: var(--color-accent);
    }

    .calc-btn-fn {
      background: var(--color-btn-fn);
      color: #cbd5e1;
    }

    .calc-btn-accent {
      background: var(--color-accent);
      color: #020617;
      font-weight: 800;
      box-shadow: 0 0 20px var(--color-glow);
    }

    .calc-btn-accent:hover {
      background: #ffffff;
      color: #020617;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-accent);
    }

    /* History Drawer Animation */
    .drawer-slide {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Glowing Text Utility */
    .text-glow {
      text-shadow: 0 0 12px var(--color-glow);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-6 min-h-screen">

  <!-- ==========================================================================
     MAIN CALCULATOR CONTAINER
     ========================================================================== -->
  <div class="glass-panel w-full max-w-[360px] rounded-2xl p-3 relative overflow-hidden flex flex-col justify-between my-auto">
    
    <!-- HEADER BAR: Theme Selector, Mode Toggles & Controls -->
    <header class="flex items-center justify-between pb-2.5 mb-2 border-b border-white/10 gap-1.5">
      <!-- Mode & Converter Tabs -->
      <div class="flex items-center gap-1 bg-slate-900/80 p-0.5 rounded-lg border border-white/10">
        <button id="tabStandard" onclick="setMode('standard')" class="px-2 py-1 rounded text-[11px] font-bold transition-all text-white bg-slate-800 shadow">
          Std
        </button>
        <button id="tabScientific" onclick="setMode('scientific')" class="px-2 py-1 rounded text-[11px] font-bold transition-all text-slate-400 hover:text-white">
          Sci
        </button>
        <button id="tabConverter" onclick="setMode('converter')" class="px-2 py-1 rounded text-[11px] font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1">
          <i class="fa-solid fa-calculator text-[9px]"></i> Conv
        </button>
      </div>

      <!-- Controls: Audio, History & Theme -->
      <div class="flex items-center gap-1.5">
        <!-- Audio Toggle -->
        <button id="btnAudio" onclick="toggleAudio()" class="w-7 h-7 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-accent border border-white/10 flex items-center justify-center transition-all" title="Audio Feedback Toggle">
          <i id="audioIcon" class="fa-solid fa-volume-high text-[11px]"></i>
        </button>

        <!-- History Drawer Toggle -->
        <button onclick="toggleHistoryDrawer()" class="w-7 h-7 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-accent border border-white/10 flex items-center justify-center transition-all relative" title="Calculation History">
          <i class="fa-solid fa-clock-rotate-left text-[11px]"></i>
          <span id="historyBadge" class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-accent animate-ping hidden"></span>
        </button>

        <!-- Theme Selector Dropdown -->
        <div class="relative">
          <button id="themeMenuBtn" onclick="toggleThemeDropdown()" class="w-7 h-7 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-accent border border-white/10 flex items-center justify-center transition-all" title="Change Theme">
            <i class="fa-solid fa-palette text-[11px]"></i>
          </button>
          
          <div id="themeDropdown" class="hidden absolute right-0 mt-2 w-36 bg-slate-900 border border-white/15 rounded-xl p-1 shadow-2xl z-50">
            <button onclick="applyTheme('cyberpunk')" class="w-full text-left px-2.5 py-1 text-[11px] font-semibold rounded-lg hover:bg-slate-800 text-cyan-400 flex items-center justify-between">
              Cyberpunk <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
            </button>
            <button onclick="applyTheme('emerald')" class="w-full text-left px-2.5 py-1 text-[11px] font-semibold rounded-lg hover:bg-slate-800 text-emerald-400 flex items-center justify-between">
              Emerald <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            </button>
            <button onclick="applyTheme('sunset')" class="w-full text-left px-2.5 py-1 text-[11px] font-semibold rounded-lg hover:bg-slate-800 text-rose-400 flex items-center justify-between">
              Sunset <span class="w-2 h-2 rounded-full bg-rose-400"></span>
            </button>
            <button onclick="applyTheme('midnight')" class="w-full text-left px-2.5 py-1 text-[11px] font-semibold rounded-lg hover:bg-slate-800 text-purple-400 flex items-center justify-between">
              Midnight <span class="w-2 h-2 rounded-full bg-purple-400"></span>
            </button>
            <button onclick="applyTheme('solar')" class="w-full text-left px-2.5 py-1 text-[11px] font-semibold rounded-lg hover:bg-slate-800 text-amber-400 flex items-center justify-between">
              Solar <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ==========================================================================
       PRIMARY DISPLAY BOARD (STANDARD & SCIENTIFIC)
       ========================================================================== -->
    <div id="calculatorDisplayPanel" class="bg-slate-950/80 rounded-xl p-3 mb-2.5 border border-white/10 flex flex-col justify-between h-[95px] relative">
      
      <!-- Top Status Indicators (Angle Mode & Memory Indicator) -->
      <div class="flex justify-between items-center text-[9px] font-mono tracking-wider text-slate-400 mb-0.5">
        <div class="flex items-center gap-1.5">
          <span id="angleIndicator" class="px-1.5 py-0.5 rounded bg-slate-800 border border-white/10 font-bold text-accent cursor-pointer" onclick="toggleAngleMode()">DEG</span>
          <span id="memoryIndicator" class="px-1.5 py-0.5 rounded bg-slate-800/50 border border-white/5 font-bold text-amber-400 hidden">MEM</span>
        </div>
        <div id="formulaDisplay" class="truncate max-w-[200px] text-right font-mono text-slate-400 text-[10px]"></div>
      </div>

      <!-- Primary Large Numerical Display -->
      <div id="mainDisplay" class="font-mono text-2xl font-extrabold text-right text-white tracking-tight text-glow overflow-x-auto whitespace-nowrap scrollbar-none py-0.5">
        0
      </div>

      <!-- Realtime Evaluated Sub-result Preview -->
      <div id="previewDisplay" class="font-mono text-[10px] text-slate-400 text-right h-3.5 truncate"></div>
    </div>

    <!-- ==========================================================================
       CONVERTER PANEL (HIDDEN BY DEFAULT)
       ========================================================================== -->
    <div id="converterPanel" class="hidden bg-slate-950/80 rounded-xl p-3 mb-2.5 border border-white/10 space-y-2.5">
      <div class="flex items-center justify-between border-b border-white/10 pb-2">
        <span class="text-[10px] font-bold uppercase text-accent tracking-wider"><i class="fa-solid fa-arrows-repeat mr-1"></i> Unit Converter</span>
        <select id="converterCategory" onchange="updateConverterUnits()" class="bg-slate-900 border border-white/15 text-[10px] text-white rounded-lg px-2 py-1 focus:outline-none focus:border-accent">
          <option value="length">Length</option>
          <option value="mass">Mass</option>
          <option value="temperature">Temperature</option>
          <option value="volume">Volume</option>
          <option value="speed">Speed</option>
        </select>
      </div>

      <div class="grid grid-cols-1 gap-2">
        <!-- From Unit -->
        <div class="space-y-1">
          <label class="text-[9px] font-bold uppercase text-slate-400">From</label>
          <div class="flex gap-1.5">
            <input type="number" id="convertFromInput" oninput="convertUnits()" value="1" class="w-1/2 bg-slate-900 border border-white/15 rounded-lg px-2 py-1 text-xs font-mono text-white focus:outline-none focus:border-accent">
            <select id="convertFromUnit" onchange="convertUnits()" class="w-1/2 bg-slate-900 border border-white/15 rounded-lg px-1.5 py-1 text-[10px] font-mono text-slate-200 focus:outline-none"></select>
          </div>
        </div>

        <!-- To Unit -->
        <div class="space-y-1">
          <label class="text-[9px] font-bold uppercase text-slate-400">To</label>
          <div class="flex gap-1.5">
            <input type="text" id="convertToResult" readonly class="w-1/2 bg-slate-900/60 border border-white/10 rounded-lg px-2 py-1 text-xs font-mono text-accent font-bold cursor-not-allowed">
            <select id="convertToUnit" onchange="convertUnits()" class="w-1/2 bg-slate-900 border border-white/15 rounded-lg px-1.5 py-1 text-[10px] font-mono text-slate-200 focus:outline-none"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- ==========================================================================
       MEMORY FUNCTION BAR
       ========================================================================== -->
    <div id="memoryBar" class="grid grid-cols-5 gap-1.5 mb-2">
      <button onclick="memoryClear()" class="calc-btn text-[10px] py-1 text-slate-400 hover:text-white">MC</button>
      <button onclick="memoryRecall()" class="calc-btn text-[10px] py-1 text-slate-400 hover:text-white">MR</button>
      <button onclick="memoryAdd()" class="calc-btn text-[10px] py-1 text-slate-400 hover:text-white">M+</button>
      <button onclick="memorySubtract()" class="calc-btn text-[10px] py-1 text-slate-400 hover:text-white">M-</button>
      <button onclick="memoryStore()" class="calc-btn text-[10px] py-1 text-slate-400 hover:text-white">MS</button>
    </div>

    <!-- ==========================================================================
       KEYPAD GRID SYSTEM
       ========================================================================== -->
    <div id="keypadGrid" class="space-y-1.5">
      
      <!-- SCIENTIFIC EXTRA KEYS ROW 1 (TOGGLEABLE DISPLAY) -->
      <div id="sciRow1" class="grid grid-cols-5 gap-1.5 hidden">
        <button onclick="appendFunction('sin')" class="calc-btn calc-btn-fn text-[11px] py-1.5">sin</button>
        <button onclick="appendFunction('cos')" class="calc-btn calc-btn-fn text-[11px] py-1.5">cos</button>
        <button onclick="appendFunction('tan')" class="calc-btn calc-btn-fn text-[11px] py-1.5">tan</button>
        <button onclick="appendFunction('sinh')" class="calc-btn calc-btn-fn text-[11px] py-1.5">sinh</button>
        <button onclick="toggleAngleMode()" class="calc-btn calc-btn-fn text-[11px] py-1.5 text-accent font-bold" id="btnAngleMode">DEG</button>
      </div>

      <!-- SCIENTIFIC EXTRA KEYS ROW 2 -->
      <div id="sciRow2" class="grid grid-cols-5 gap-1.5 hidden">
        <button onclick="appendFunction('asin')" class="calc-btn calc-btn-fn text-[11px] py-1.5">sin⁻¹</button>
        <button onclick="appendFunction('acos')" class="calc-btn calc-btn-fn text-[11px] py-1.5">cos⁻¹</button>
        <button onclick="appendFunction('atan')" class="calc-btn calc-btn-fn text-[11px] py-1.5">tan⁻¹</button>
        <button onclick="appendFunction('ln')" class="calc-btn calc-btn-fn text-[11px] py-1.5">ln</button>
        <button onclick="appendFunction('log')" class="calc-btn calc-btn-fn text-[11px] py-1.5">log₁₀</button>
      </div>

      <!-- SCIENTIFIC EXTRA KEYS ROW 3 -->
      <div id="sciRow3" class="grid grid-cols-5 gap-1.5 hidden">
        <button onclick="appendSymbol('^')" class="calc-btn calc-btn-fn text-[11px] py-1.5">x^y</button>
        <button onclick="appendFunction('sqrt')" class="calc-btn calc-btn-fn text-[11px] py-1.5">√x</button>
        <button onclick="appendFunction('cbrt')" class="calc-btn calc-btn-fn text-[11px] py-1.5">∛x</button>
        <button onclick="appendSymbol('!')" class="calc-btn calc-btn-fn text-[11px] py-1.5">n!</button>
        <button onclick="appendValue('π')" class="calc-btn calc-btn-fn text-[11px] py-1.5">π</button>
      </div>

      <!-- STANDARD KEYPAD (ALWAYS VISIBLE) -->
      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="clearAll()" class="calc-btn calc-btn-fn text-xs py-2 font-bold text-rose-400">AC</button>
        <button onclick="deleteLast()" class="calc-btn calc-btn-fn text-xs py-2 font-bold text-amber-400"><i class="fa-solid fa-delete-left text-[11px]"></i></button>
        <button onclick="appendSymbol('%')" class="calc-btn calc-btn-fn text-xs py-2">%</button>
        <button onclick="appendSymbol('÷')" class="calc-btn calc-btn-op text-sm py-2">÷</button>

        <button onclick="appendValue('7')" class="calc-btn text-sm py-2">7</button>
        <button onclick="appendValue('8')" class="calc-btn text-sm py-2">8</button>
        <button onclick="appendValue('9')" class="calc-btn text-sm py-2">9</button>
        <button onclick="appendSymbol('×')" class="calc-btn calc-btn-op text-sm py-2">×</button>

        <button onclick="appendValue('4')" class="calc-btn text-sm py-2">4</button>
        <button onclick="appendValue('5')" class="calc-btn text-sm py-2">5</button>
        <button onclick="appendValue('6')" class="calc-btn text-sm py-2">6</button>
        <button onclick="appendSymbol('-')" class="calc-btn calc-btn-op text-sm py-2">−</button>

        <button onclick="appendValue('1')" class="calc-btn text-sm py-2">1</button>
        <button onclick="appendValue('2')" class="calc-btn text-sm py-2">2</button>
        <button onclick="appendValue('3')" class="calc-btn text-sm py-2">3</button>
        <button onclick="appendSymbol('+')" class="calc-btn calc-btn-op text-sm py-2">+</button>

        <button onclick="toggleSign()" class="calc-btn text-sm py-2">±</button>
        <button onclick="appendValue('0')" class="calc-btn text-sm py-2">0</button>
        <button onclick="appendValue('.')" class="calc-btn text-sm py-2">.</button>
        <button onclick="calculateResult()" class="calc-btn calc-btn-accent text-sm py-2">=</button>
      </div>

      <!-- PARENTHESES & CONSTANTS ROW -->
      <div class="grid grid-cols-4 gap-1.5 pt-0.5">
        <button onclick="appendValue('(')" class="calc-btn calc-btn-fn text-[11px] py-1.5">(</button>
        <button onclick="appendValue(')')" class="calc-btn calc-btn-fn text-[11px] py-1.5">)</button>
        <button onclick="appendValue('e')" class="calc-btn calc-btn-fn text-[11px] py-1.5">e</button>
        <button onclick="appendFunction('abs')" class="calc-btn calc-btn-fn text-[11px] py-1.5">|x|</button>
      </div>

    </div>

    <!-- ==========================================================================
       HISTORY DRAWER OVERLAY
       ========================================================================== -->
    <div id="historyDrawer" class="absolute inset-y-0 right-0 w-full bg-slate-950/95 border-l border-white/15 p-4 shadow-2xl backdrop-blur-2xl drawer-slide transform translate-x-full z-40 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
          <h3 class="font-bold text-xs text-white flex items-center gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-accent"></i> Calculation History
          </h3>
          <button onclick="toggleHistoryDrawer()" class="w-6 h-6 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
            <i class="fa-solid fa-xmark text-[10px]"></i>
          </button>
        </div>

        <div id="historyList" class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
          <!-- History items will be dynamically injected here -->
        </div>
      </div>

      <div class="pt-3 border-t border-white/10 flex gap-2">
        <button onclick="clearHistory()" class="w-full py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-bold transition-all">
          Clear History
        </button>
      </div>
    </div>

  </div>

  <!-- Footer Branding -->
  <footer class="mt-3 text-center text-[10px] text-slate-500 font-mono tracking-wider">
    ULTRA-PREMIUM CALCULATOR ENGINE &copy; 2026
  </footer>

  <!-- ==========================================================================
     JAVASCRIPT APPLICATION LOGIC
     ========================================================================== -->
  <script>
    /* ==========================================================================
       STATE MANAGEMENT
       ========================================================================== */
    let currentExpression = '';
    let memoryValue = 0;
    let angleMode = 'DEG'; // 'DEG' or 'RAD'
    let audioEnabled = true;
    let history = [];
    let currentMode = 'standard'; // 'standard', 'scientific', 'converter'

    /* Web Audio API Synthesizer setup for Haptic Sound Effects */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playClickSound(freq = 600, type = 'sine') {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        console.warn('Audio Synthesis Warning:', e);
      }
    }

    /* ==========================================================================
       UI INTERACTION & MODE HANDLERS
       ========================================================================== */
    function setMode(mode) {
      playClickSound(800);
      currentMode = mode;
      
      const tabStd = document.getElementById('tabStandard');
      const tabSci = document.getElementById('tabScientific');
      const tabConv = document.getElementById('tabConverter');

      const displayPanel = document.getElementById('calculatorDisplayPanel');
      const converterPanel = document.getElementById('converterPanel');
      const sciRow1 = document.getElementById('sciRow1');
      const sciRow2 = document.getElementById('sciRow2');
      const sciRow3 = document.getElementById('sciRow3');

      // Reset Tab Styles
      [tabStd, tabSci, tabConv].forEach(tab => {
        tab.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
      });

      if (mode === 'standard') {
        tabStd.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white bg-slate-800 shadow";
        displayPanel.classList.remove('hidden');
        converterPanel.classList.add('hidden');
        sciRow1.classList.add('hidden');
        sciRow2.classList.add('hidden');
        sciRow3.classList.add('hidden');
      } else if (mode === 'scientific') {
        tabSci.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white bg-slate-800 shadow";
        displayPanel.classList.remove('hidden');
        converterPanel.classList.add('hidden');
        sciRow1.classList.remove('hidden');
        sciRow2.classList.remove('hidden');
        sciRow3.classList.remove('hidden');
      } else if (mode === 'converter') {
        tabConv.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white bg-slate-800 shadow";
        displayPanel.classList.add('hidden');
        converterPanel.classList.remove('hidden');
        sciRow1.classList.add('hidden');
        sciRow2.classList.add('hidden');
        sciRow3.classList.add('hidden');
        updateConverterUnits();
      }
    }

    function toggleAngleMode() {
      playClickSound(700);
      angleMode = (angleMode === 'DEG') ? 'RAD' : 'DEG';
      document.getElementById('angleIndicator').textContent = angleMode;
      document.getElementById('btnAngleMode').textContent = angleMode;
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('btnAudio');
      const icon = document.getElementById('audioIcon');
      
      if (audioEnabled) {
        icon.className = 'fa-solid fa-volume-high text-xs';
        btn.classList.remove('text-rose-400');
        playClickSound(900);
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-xs';
        btn.classList.add('text-rose-400');
      }
    }

    function toggleThemeDropdown() {
      playClickSound(500);
      const dropdown = document.getElementById('themeDropdown');
      dropdown.classList.toggle('hidden');
    }

    function applyTheme(themeName) {
      playClickSound(750);
      document.documentElement.setAttribute('data-theme', themeName);
      document.getElementById('themeDropdown').classList.add('hidden');
    }

    function toggleHistoryDrawer() {
      playClickSound(600);
      const drawer = document.getElementById('historyDrawer');
      drawer.classList.toggle('translate-x-full');
    }

    /* ==========================================================================
       CALCULATOR INPUT & EVALUATION ENGINE
       ========================================================================== */
    function updateDisplay() {
      const mainDisp = document.getElementById('mainDisplay');
      const formulaDisp = document.getElementById('formulaDisplay');
      const previewDisp = document.getElementById('previewDisplay');

      mainDisp.textContent = currentExpression || '0';
      
      if (currentExpression) {
        try {
          const evaluated = evaluateExpression(currentExpression);
          if (evaluated !== undefined && !isNaN(evaluated)) {
            previewDisp.textContent = '= ' + formatNumber(evaluated);
          } else {
            previewDisp.textContent = '';
          }
        } catch (e) {
          previewDisp.textContent = '';
        }
      } else {
        previewDisp.textContent = '';
      }
    }

    function appendValue(val) {
      playClickSound(400);
      currentExpression += val;
      updateDisplay();
    }

    function appendSymbol(sym) {
      playClickSound(500);
      currentExpression += sym;
      updateDisplay();
    }

    function appendFunction(fn) {
      playClickSound(550);
      currentExpression += fn + '(';
      updateDisplay();
    }

    function clearAll() {
      playClickSound(300, 'triangle');
      currentExpression = '';
      document.getElementById('formulaDisplay').textContent = '';
      updateDisplay();
    }

    function deleteLast() {
      playClickSound(350);
      currentExpression = currentExpression.slice(0, -1);
      updateDisplay();
    }

    function toggleSign() {
      playClickSound(450);
      if (!currentExpression) return;
      if (currentExpression.startsWith('-')) {
        currentExpression = currentExpression.substring(1);
      } else {
        currentExpression = '-' + currentExpression;
      }
      updateDisplay();
    }

    /* Factorial calculation */
    function factorial(n) {
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    /* Safe mathematical expression parser */
    function evaluateExpression(expr) {
      if (!expr) return 0;

      // Replace graphical symbols with JavaScript math equivalents
      let parsed = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/π/g, 'Math.PI')
        .replace(/\be\b/g, 'Math.E');

      // Handle Factorials (e.g. 5!)
      parsed = parsed.replace(/(\d+)!/g, (match, number) => {
        return factorial(parseInt(number));
      });

      // Handle Percentage (e.g. 50%)
      parsed = parsed.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

      // Handle Power operator (e.g. 2^3 -> Math.pow(2,3))
      while (parsed.includes('^')) {
        parsed = parsed.replace(/([0-9\.]+)\^([0-9\.]+)/g, 'Math.pow($1, $2)');
      }

      // Trig Helpers based on DEG/RAD mode
      const toRad = (val) => angleMode === 'DEG' ? (val * Math.PI) / 180 : val;
      const fromRad = (val) => angleMode === 'DEG' ? (val * 180) / Math.PI : val;

      const sin = (x) => Math.sin(toRad(x));
      const cos = (x) => Math.cos(toRad(x));
      const tan = (x) => Math.tan(toRad(x));

      const asin = (x) => fromRad(Math.asin(x));
      const acos = (x) => fromRad(Math.acos(x));
      const atan = (x) => fromRad(Math.atan(x));

      const sinh = (x) => Math.sinh(x);
      const ln = (x) => Math.log(x);
      const log = (x) => Math.log10(x);
      const sqrt = (x) => Math.sqrt(x);
      const cbrt = (x) => Math.cbrt(x);
      const abs = (x) => Math.abs(x);

      // Execute in isolated function context
      const fn = new Function(
        'sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sinh',
        'ln', 'log', 'sqrt', 'cbrt', 'abs',
        'return ' + parsed
      );

      return fn(sin, cos, tan, asin, acos, atan, sinh, ln, log, sqrt, cbrt, abs);
    }

    function calculateResult() {
      playClickSound(700, 'square');
      if (!currentExpression) return;

      try {
        const result = evaluateExpression(currentExpression);
        if (isNaN(result) || !isFinite(result)) {
          showError('Math Error');
          return;
        }

        const formattedResult = formatNumber(result);
        
        // Save to History
        addHistoryItem(currentExpression, formattedResult);
        
        document.getElementById('formulaDisplay').textContent = currentExpression + ' =';
        currentExpression = String(result);
        updateDisplay();
      } catch (e) {
        showError('Syntax Error');
      }
    }

    function showError(msg) {
      const mainDisp = document.getElementById('mainDisplay');
      mainDisp.textContent = msg;
      currentExpression = '';
    }

    function formatNumber(num) {
      if (Math.abs(num) > 1e12 || (Math.abs(num) < 1e-6 && num !== 0)) {
        return num.toExponential(6);
      }
      return parseFloat(num.toFixed(10)).toString();
    }

    /* ==========================================================================
       MEMORY FUNCTIONS
       ========================================================================== */
    function updateMemoryIndicator() {
      const ind = document.getElementById('memoryIndicator');
      if (memoryValue !== 0) {
        ind.classList.remove('hidden');
      } else {
        ind.classList.add('hidden');
      }
    }

    function memoryClear() {
      playClickSound(300);
      memoryValue = 0;
      updateMemoryIndicator();
    }

    function memoryRecall() {
      playClickSound(400);
      currentExpression += memoryValue.toString();
      updateDisplay();
    }

    function memoryAdd() {
      playClickSound(450);
      try {
        const val = evaluateExpression(currentExpression || '0');
        memoryValue += val;
        updateMemoryIndicator();
      } catch (e) {}
    }

    function memorySubtract() {
      playClickSound(450);
      try {
        const val = evaluateExpression(currentExpression || '0');
        memoryValue -= val;
        updateMemoryIndicator();
      } catch (e) {}
    }

    function memoryStore() {
      playClickSound(500);
      try {
        const val = evaluateExpression(currentExpression || '0');
        memoryValue = val;
        updateMemoryIndicator();
      } catch (e) {}
    }

    /* ==========================================================================
       HISTORY DRAWER MANAGEMENT
       ========================================================================== */
    function addHistoryItem(expr, res) {
      history.unshift({ expression: expr, result: res });
      if (history.length > 20) history.pop();
      renderHistory();
      
      const badge = document.getElementById('historyBadge');
      badge.classList.remove('hidden');
      setTimeout(() => badge.classList.add('hidden'), 2000);
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">No calculation history yet.</div>`;
        return;
      }

      list.innerHTML = history.map((item, index) => `
        <div onclick="useHistoryItem(${index})" class="bg-slate-900/80 hover:bg-slate-800 p-3 rounded-xl border border-white/10 cursor-pointer transition-all">
          <div class="text-xs text-slate-400 font-mono truncate">${item.expression} =</div>
          <div class="text-sm font-bold font-mono text-accent text-right">${item.result}</div>
        </div>
      `).join('');
    }

    function useHistoryItem(index) {
      playClickSound(500);
      const item = history[index];
      currentExpression = item.result;
      updateDisplay();
      toggleHistoryDrawer();
    }

    function clearHistory() {
      playClickSound(300);
      history = [];
      renderHistory();
    }

    /* ==========================================================================
       UNIT CONVERTER LOGIC
       ========================================================================== */
    const unitMap = {
      length: {
        meters: 1,
        kilometers: 0.001,
        centimeters: 100,
        millimeters: 1000,
        miles: 0.000621371,
        feet: 3.28084,
        inches: 39.3701
      },
      mass: {
        kilograms: 1,
        grams: 1000,
        milligrams: 1e6,
        pounds: 2.20462,
        ounces: 35.274
      },
      temperature: {
        // Handled via custom functions
      },
      volume: {
        liters: 1,
        milliliters: 1000,
        gallons: 0.264172,
        quarts: 1.05669,
        cups: 4.22675
      },
      speed: {
        metersPerSec: 1,
        kmPerHour: 3.6,
        milesPerHour: 2.23694,
        knots: 1.94384
      }
    };

    function updateConverterUnits() {
      const cat = document.getElementById('converterCategory').value;
      const fromSelect = document.getElementById('convertFromUnit');
      const toSelect = document.getElementById('convertToUnit');

      let options = [];
      if (cat === 'temperature') {
        options = ['celsius', 'fahrenheit', 'kelvin'];
      } else {
        options = Object.keys(unitMap[cat]);
      }

      fromSelect.innerHTML = options.map(u => `<option value="${u}">${u}</option>`).join('');
      toSelect.innerHTML = options.map(u => `<option value="${u}">${u}</option>`).join('');

      if (options.length > 1) toSelect.selectedIndex = 1;
      convertUnits();
    }

    function convertUnits() {
      const cat = document.getElementById('converterCategory').value;
      const val = parseFloat(document.getElementById('convertFromInput').value) || 0;
      const from = document.getElementById('convertFromUnit').value;
      const to = document.getElementById('convertToUnit').value;
      const resultInput = document.getElementById('convertToResult');

      if (cat === 'temperature') {
        let inCelsius = val;
        if (from === 'fahrenheit') inCelsius = (val - 32) * 5/9;
        if (from === 'kelvin') inCelsius = val - 273.15;

        let res = inCelsius;
        if (to === 'fahrenheit') res = (inCelsius * 9/5) + 32;
        if (to === 'kelvin') res = inCelsius + 273.15;

        resultInput.value = formatNumber(res);
      } else {
        const base = val / unitMap[cat][from];
        const res = base * unitMap[cat][to];
        resultInput.value = formatNumber(res);
      }
    }

    /* ==========================================================================
       KEYBOARD SHORTCUT SUPPORT
       ========================================================================== */
    document.addEventListener('keydown', (e) => {
      if (currentMode === 'converter') return;

      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        appendValue(e.key);
      } else if (e.key === '+') {
        appendSymbol('+');
      } else if (e.key === '-') {
        appendSymbol('-');
      } else if (e.key === '*') {
        appendSymbol('×');
      } else if (e.key === '/') {
        e.preventDefault();
        appendSymbol('÷');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculateResult();
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape') {
        clearAll();
      } else if (e.key === '(' || e.key === ')') {
        appendValue(e.key);
      } else if (e.key === '^') {
        appendSymbol('^');
      }
    });

    /* Close Theme Dropdown when clicking outside */
    document.addEventListener('click', (e) => {
      const btn = document.getElementById('themeMenuBtn');
      const dropdown = document.getElementById('themeDropdown');
      if (btn && dropdown && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });

    // Initialize UI
    renderHistory();
  </script>
